<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>
<title>投資雷達</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="台股、全球股市、AI 股與國際局勢一頁看完">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：頂部工具列 → 一句話 → 局勢警示卡 → 三欄儀表（行情｜全球與AI｜地圖與重點），手機變單欄 */
:root{
  --bg:#edf0f4; --panel:#ffffff; --panel-2:#f4f6f9; --line:#dfe3ea; --fg:#1b2130; --muted:#626b7e; --faint:#98a0ae;
  --accent:#2a4db3; --accent-fg:#ffffff; --accent-soft:#e5ebfa;
  --red:#d33a3a; --green:#16955a; --amber:#b9820b;
  --up:var(--red); --down:var(--green);
  --war:#cf3b3b; --ceasefire:#2c67d1; --unrest:#d8641c; --epidemic:#8448db; --military:#a87b08; --politics:#4a5468; --disaster:#83603b;
  --sea:#e4e9f0; --land:#cdd4de; --land-line:#bcc4d0;
  --font-body:"Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-num:"Barlow Semi Condensed", "Noto Sans TC", system-ui, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1218; --panel:#181c24; --panel-2:#20252f; --line:#2b313d; --fg:#e6e9ef; --muted:#9aa3b4; --faint:#687082;
  --accent:#8aa4f6; --accent-fg:#0f1218; --accent-soft:#222b44;
  --red:#ff6767; --green:#35c97a; --amber:#e0a93a;
  --sea:#151a22; --land:#2a313d; --land-line:#38404e; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1218; --panel:#181c24; --panel-2:#20252f; --line:#2b313d; --fg:#e6e9ef; --muted:#9aa3b4; --faint:#687082;
  --accent:#8aa4f6; --accent-fg:#0f1218; --accent-soft:#222b44;
  --red:#ff6767; --green:#35c97a; --amber:#e0a93a;
  --sea:#151a22; --land:#2a313d; --land-line:#38404e; color-scheme:dark }
:root.us-colors{ --up:var(--green); --down:var(--red) }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 32px}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.u{color:var(--up)} .d{color:var(--down)} .z{color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.wrap{max-width:1680px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* 頂部 */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.brand h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.brand .stamp{color:var(--muted);font-size:12.5px}
.tabs{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tab{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.tab .num{margin-left:4px}
.actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px}
.oneliner{display:flex;gap:10px;align-items:baseline;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px}
.oneliner b{color:var(--accent);white-space:nowrap;font-weight:700}
.oneliner span{min-width:0}

/* 警示卡 */
.alerts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.alert{border-radius:var(--r);padding:11px 14px;color:#fff;display:flex;gap:11px;align-items:flex-start;min-width:0;cursor:pointer;border:0;text-align:left}
.alert svg{flex:none;margin-top:2px}
.alert .t{font-weight:700;font-size:16px;line-height:1.3}
.alert .s{font-size:12.5px;opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.alert>div{min-width:0}

/* 原物料條 */
.strip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;min-width:0}
.chip .n{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .v{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.chip .v b{font-size:17px;font-weight:600}
.chip .v span{font-size:13px}

/* 三欄 */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr) minmax(0,1.2fr);gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.card-h h2{font-size:16px;margin:0;font-weight:700}
.card-h .hint{font-size:12px;color:var(--faint);text-align:right}
.linkish{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-size:12px}

/* 台股 */
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.big .val{font-size:44px;font-weight:600;line-height:1}
.big .pc{font-size:26px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.stat{background:var(--panel-2);border-radius:8px;padding:6px 10px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:19px;font-weight:600}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%);display:none}
.posbar{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--down),#e5c040 55%,var(--up));margin:10px 0 4px}
.posbar i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--fg);transform:translateX(-50%);box-shadow:0 0 0 2px var(--panel)}
.posbar.thin{height:4px;margin:6px 0 2px;border-radius:2px}
.posbar.thin i{top:-3px;height:10px;width:3px}
.poslabels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.possent{margin-top:6px;font-size:14px}

/* 全球股市 */
.mkts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mkt{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;background:var(--panel)}
.mkt .h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mkt .h .n{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkt .h .p{font-size:16px;font-weight:600;white-space:nowrap}
.mkt .f{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.mkt svg{display:block;width:100%;height:40px;margin-top:4px}

/* AI */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.tile{border-radius:8px;padding:6px 9px;min-width:0}
.tile .a{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .b{font-size:18px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:6px;align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.aibanner{background:var(--accent-soft);border-radius:8px;padding:7px 12px;margin-bottom:10px;font-size:13.5px}
.aibanner b{color:var(--accent);margin-right:8px}
.aicols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.aicols h3{font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:500}
.nitem{display:block;text-decoration:none;padding:5px 0;border-bottom:1px dashed var(--line)}
.nitem:last-child{border-bottom:0}
.nitem .t{font-size:13.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nitem .m{font-size:11.5px;color:var(--faint)}
.nitem:hover .t{color:var(--accent)}
.edate{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.edate b{font-family:var(--font-num);min-width:44px}

/* 地圖 */
.map{position:relative;border-radius:10px;overflow:hidden;background:var(--sea)}
.map svg{display:block;width:100%;height:auto}
.map .land{fill:var(--land);stroke:var(--land-line);stroke-width:.4}
.map .grat{stroke:var(--land-line);stroke-width:.3;fill:none;opacity:.5}
.hs{cursor:pointer}
.hs text{font-family:var(--font-body);font-weight:700;fill:#fff}
.pulse{animation:pulse 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{opacity:.55;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none;opacity:.25}}
.mapnote{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--muted)}
.detail{margin-top:10px;background:var(--panel-2);border-radius:8px;padding:8px 12px}
.detail h4{margin:0 0 4px;font-size:14px}

/* 局勢列表 */
.sit{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:6px 10px;align-items:baseline}
.tag{font-size:11.5px;color:#fff;border-radius:5px;padding:1px 7px;white-space:nowrap;font-weight:500}
.dots{letter-spacing:-1px;font-size:11px;white-space:nowrap}
.sit .txt{font-size:13.5px;min-width:0}
.sit .txt b{margin-right:8px}
.sit .txt a{color:var(--muted);text-decoration:none}
.sit .txt a:hover{color:var(--accent);text-decoration:underline}
.fin{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:baseline}
.fin .tt{font-weight:600;margin-right:8px}
.fin .tx{color:var(--muted);font-size:13px}
.lv-info{background:var(--accent)} .lv-warn{background:var(--amber)} .lv-hot{background:var(--red)}
:root[data-theme="dark"] .lv-info{color:var(--accent-fg)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .lv-info{color:var(--accent-fg)} }

/* 早報 */
.brief-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.brief-head h2{margin:0;font-size:24px;text-wrap:balance}
.keyrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.sec h3{margin:0 0 8px;font-size:16px}
.sec ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.sec li{line-height:1.55}
.sec li a{text-decoration:none}
.sec li a:hover{color:var(--accent);text-decoration:underline}

/* 資產 */
.sumrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sum .k{font-size:12.5px;color:var(--muted)}
.sum .v{font-size:28px;font-weight:600;line-height:1.2}
.sum .s{font-size:13px}
.alloc{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--panel-2);margin:6px 0 8px}
.alloc span{display:block;height:100%}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--panel-2)}
th:first-child,td:first-child{text-align:left}
td .sub{display:block;font-size:11.5px;color:var(--faint)}
.rowbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 4px;font-size:12.5px}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.field input,.field select,textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}

/* 視窗 */
.modal{position:fixed;inset:0;background:rgb(10 14 22 / .45);display:flex;align-items:center;justify-content:center;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));z-index:50}
.modal>.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:620px;width:100%;max-height:100%;overflow:auto;padding:18px 20px}
.box h2{margin:0 0 12px;font-size:18px}
.box .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.box .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 10px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.warnlist{font-size:12.5px;color:var(--muted);max-height:180px;overflow:auto;background:var(--panel-2);border-radius:8px;padding:8px 12px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

@media (max-width:1240px){
  .cols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .col.c3{grid-column:1 / -1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .col.c3 .card.mapcard{grid-column:1 / -1}
  .strip{grid-template-columns:repeat(4,minmax(0,1fr))}
  .keyrow{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:860px){
  .alerts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols,.col.c3{grid-template-columns:minmax(0,1fr)}
  .bgrid{grid-template-columns:minmax(0,1fr)}
  .sumrow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions{margin-left:0}
}
@media (max-width:560px){
  .big .val{font-size:36px} .big .pc{font-size:21px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .keyrow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mkts{grid-template-columns:minmax(0,1fr)}
  .mkt{display:grid;grid-template-columns:minmax(0,1fr) 90px;column-gap:10px;align-items:center}
  .mkt .h{grid-column:1} .mkt svg{grid-column:2;grid-row:1 / span 3;height:34px;margin:0}
  .aicols{grid-template-columns:minmax(0,1fr)}
  .alert .t{font-size:14.5px}
  .tabs{width:100%} .tab{flex:1;padding:6px 6px}
  .sum .v{font-size:22px}
}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand"><h1>投資雷達</h1><span class="stamp" id="stamp">載入中…</span></div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="brief" id="tab-brief">今日早報</button>
      <button class="tab" role="tab" data-tab="world" id="tab-world">今天的世界</button>
      <button class="tab" role="tab" data-tab="assets" id="tab-assets">我的資產<span class="num" id="assetTabPct"></span></button>
    </nav>
    <div class="actions">
      <button class="btn" id="btnReload" type="button">重新載入</button>
      <a class="btn primary" id="btnUpdate" target="_blank" rel="noopener" hidden>立即抓新資料</a>
      <button class="btn" id="btnSources" type="button">資料來源</button>
      <button class="btn" id="btnSettings" type="button">設定</button>
    </div>
  </header>
  <div class="banner" id="demoBanner" hidden>目前顯示的是<b>示範資料</b>（數字與新聞都不是真的），用來預覽畫面。照 README 部署到 GitHub 或在電腦上執行抓取程式後，就會換成真實資料。</div>
  <div class="oneliner"><b>今日重點</b><span id="oneliner">—</span></div>
  <main id="view"><div class="loading">資料載入中…</div></main>
</div>
<div id="modalRoot"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem("radar." + k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("radar." + k, JSON.stringify(v)); }catch{} }
};
let D = null, TAB = "world", reloadTimer = null, selectedHs = null;

const CAT = {
  war:{c:"var(--war)", s:"戰爭"}, ceasefire:{c:"var(--ceasefire)", s:"停火"}, unrest:{c:"var(--unrest)", s:"動亂"},
  epidemic:{c:"var(--epidemic)", s:"疫情"}, military:{c:"var(--military)", s:"軍事"}, politics:{c:"var(--politics)", s:"政治"},
  disaster:{c:"var(--disaster)", s:"天災"}
};
const ICON = {
  war:'<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/>',
  ceasefire:'<path d="M3 12h4l3-3 4 4 3-3h4"/><path d="M7 12l3 3M14 13l2 2"/>',
  unrest:'<path d="M12 21c-4 0-7-2.6-7-6.5 0-3 2-5 3.5-6.5.3 2 1.5 3 2.5 3.3C11 8 12.5 5 15 3c0 3 4 5.5 4 10.5 0 4.2-3 7.5-7 7.5z"/>',
  epidemic:'<circle cx="12" cy="12" r="5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
  military:'<path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3z"/>',
  politics:'<path d="M3 21h18M5 21V10M19 21V10M9 21V10M15 21V10M2 10l10-6 10 6"/>',
  disaster:'<path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 20c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M12 3v6"/>'
};
const icon = (k, sz = 22) => `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k] || ICON.war}</svg>`;

/* ---------- 格式 ---------- */
const nf = (x, nd = 2) => x == null || isNaN(x) ? "—" : Number(x).toLocaleString("zh-TW", {minimumFractionDigits: nd, maximumFractionDigits: nd});
const cls = p => p > 0 ? "u" : p < 0 ? "d" : "z";
const tri = p => p == null ? "—" : `${p > 0 ? "▲" : p < 0 ? "▼" : ""}${Math.abs(p).toFixed(2)}%`;
const sgn = (p, nd = 1) => p == null ? "—" : `${p > 0 ? "+" : ""}${p.toFixed(nd)}%`;
const posLabel = p => p >= .8 ? "高檔" : p >= .6 ? "偏高" : p >= .4 ? "中間" : p >= .2 ? "偏低" : "低檔";
const ago = ts => { const m = Math.round((Date.now()/1000 - ts)/60); return m < 60 ? `${Math.max(m,1)} 分鐘前` : m < 1440 ? `${Math.round(m/60)} 小時前` : `${Math.round(m/1440)} 天前`; };
const md = s => s ? s.slice(5).replace("-", "/") : "";

/* ---------- 圖表 ---------- */
function sparkSVG(vals, {w = 200, h = 40, color = "var(--accent)", fill = true, markerLast = false} = {}){
  const v = vals.filter(x => x != null);
  if (v.length < 2) return `<svg viewBox="0 0 ${w} ${h}"></svg>`;
  const lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
  const pts = v.map((y, i) => [i / (v.length - 1) * w, h - 3 - (y - lo) / span * (h - 6)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    ${fill ? `<path d="${d}L${w} ${h}L0 ${h}Z" fill="${color}" opacity=".13"/>` : ""}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    ${markerLast ? `<circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="${color}"/>` : ""}</svg>`;
}

/* 可互動的折線圖：series = [{d:[], c:[], color, name, fill}] */
function lineChart(el, series, {h = 230, w = 600, maxLine = false, fmt = v => nf(v)} = {}){
  const all = series.flatMap(s => s.c.filter(x => x != null));
  if (!all.length){ el.innerHTML = '<div class="muted">沒有資料</div>'; return; }
  const lo = Math.min(...all), hi = Math.max(...all), span = hi - lo || 1;
  const n = Math.max(...series.map(s => s.c.length));
  const X = i => i / (n - 1) * w, Y = v => h - 8 - (v - lo) / span * (h - 22);
  let svg = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="走勢圖">`;
  for (let g = 1; g < 4; g++) svg += `<line x1="0" x2="${w}" y1="${(h - 8) - g * (h - 22) / 4}" y2="${(h - 8) - g * (h - 22) / 4}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  if (maxLine) svg += `<line x1="0" x2="${w}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--up)" stroke-dasharray="4 4" opacity=".6" vector-effect="non-scaling-stroke"/>`;
  series.forEach(s => {
    let d = "", started = false;
    s.c.forEach((v, i) => { if (v == null) return; d += (started ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); started = true; });
    if (s.fill) svg += `<path d="${d}L${w} ${h}L0 ${h}Z" fill="${s.color}" opacity=".12"/>`;
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
    const li = s.c.length - 1; if (s.c[li] != null) svg += `<circle cx="${X(li)}" cy="${Y(s.c[li])}" r="3.5" fill="${s.color}" stroke="var(--panel)" stroke-width="1.5"/>`;
  });
  svg += `<line class="cur" x1="0" x2="0" y1="0" y2="${h}" stroke="var(--faint)" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/>`;
  svg += `<rect width="${w}" height="${h}" fill="transparent"/></svg><div class="tip"></div>`;
  el.innerHTML = svg;
  const s0 = el.querySelector("svg"), tip = el.querySelector(".tip"), cur = el.querySelector(".cur");
  const move = e => {
    const r = s0.getBoundingClientRect();
    const i = Math.max(0, Math.min(n - 1, Math.round((e.clientX - r.left) / r.width * (n - 1))));
    const dt = series[0].d[i];
    cur.setAttribute("x1", X(i)); cur.setAttribute("x2", X(i)); cur.setAttribute("visibility", "visible");
    tip.style.display = "block";
    tip.style.left = Math.min(r.width - 60, Math.max(60, (X(i) / w) * r.width)) + "px";
    tip.style.top = "14px";
    tip.textContent = (dt || "") + "　" + series.map(s => (series.length > 1 ? s.name + " " : "") + (s.c[i] == null ? "—" : fmt(s.c[i]))).join("　");
  };
  s0.addEventListener("pointermove", move);
  s0.addEventListener("pointerleave", () => { tip.style.display = "none"; cur.setAttribute("visibility", "hidden"); });
}
const posBar = (p, thin = false) => `<div class="posbar${thin ? " thin" : ""}" role="img" aria-label="一年內位置 ${Math.round(p * 100)}%"><i style="left:${Math.max(1, Math.min(99, p * 100))}%"></i></div>`;

/* ---------- 地圖 ---------- */
const W = 1000, H = 500;
const px = (lon, lat) => [(lon + 180) / 360 * W, (90 - lat) / 180 * H];
let LAND = null;
function ringPath(pts){
  let d = "", lx = 1e9, ly = 1e9;
  pts.forEach(([lon, lat], i) => {
    const [x, y] = px(lon, lat);
    if (i && Math.abs(x - lx) < .6 && Math.abs(y - ly) < .6 && i < pts.length - 1) return;
    d += (d ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1); lx = x; ly = y;
  });
  return d + "Z";
}
function topoToPath(topo, name){
  const tf = topo.transform;
  const arcs = topo.arcs.map(a => { let x = 0, y = 0; return a.map(p => tf ? (x += p[0], y += p[1], [x * tf.scale[0] + tf.translate[0], y * tf.scale[1] + tf.translate[1]]) : p); });
  const ring = ids => { let out = []; ids.forEach((i, k) => { let a = i < 0 ? arcs[~i].slice().reverse() : arcs[i]; if (k) a = a.slice(1); out = out.concat(a); }); return out; };
  const obj = topo.objects[name]; const geoms = obj.type === "GeometryCollection" ? obj.geometries : [obj];
  let d = "";
  geoms.forEach(g => {
    if (g.type === "Polygon") g.arcs.forEach(r => d += ringPath(ring(r)));
    if (g.type === "MultiPolygon") g.arcs.forEach(p => p.forEach(r => d += ringPath(ring(r))));
  });
  return d;
}
function geoToPath(fc){
  let d = "";
  (fc.features || []).forEach(f => { const g = f.geometry; if (!g) return;
    if (g.type === "Polygon") g.coordinates.forEach(r => d += ringPath(r));
    if (g.type === "MultiPolygon") g.coordinates.forEach(p => p.forEach(r => d += ringPath(r))); });
  return d;
}
async function loadLand(){
  if (LAND) return LAND;
  const cached = store.get("land.v1", null); if (cached) return LAND = cached;
  try {
    const r = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json");
    if (r.ok){ LAND = topoToPath(await r.json(), "land"); }
  } catch {}
  if (!LAND){
    for (const v of ["5.1.4", "5.1.2", "5.1.0", "5.0.3"]){
      try { const m = await import(`https://cdn.jsdelivr.net/npm/@amcharts/amcharts5-geodata@${v}/worldLow.js`); LAND = geoToPath(m.default); if (LAND) break; } catch {}
    }
  }
  if (LAND) store.set("land.v1", LAND);
  return LAND || "";
}
function viewBoxFor(hs){
  if (!hs.length) return [0, px(0, 75)[1], W, px(0, -45)[1] - px(0, 75)[1]];
  const xs = hs.map(h => px(h.lon, h.lat)[0]), ys = hs.map(h => px(h.lon, h.lat)[1]);
  let x0 = Math.min(...xs) - 60, x1 = Math.max(...xs) + 140, y0 = Math.min(...ys) - 45, y1 = Math.max(...ys) + 45;
  let w = Math.max(x1 - x0, 360), h = Math.max(y1 - y0, w / 1.75);
  w = Math.max(w, h * 1.75);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  x0 = Math.max(0, Math.min(W - w, cx - w / 2)); y0 = Math.max(0, Math.min(H - h, cy - h / 2));
  return [x0, y0, Math.min(w, W), Math.min(h, H)];
}
async function drawMap(){
  const el = $("#map"); if (!el) return;
  const hs = D.world?.hotspots || [];
  const vb = viewBoxFor(hs);
  const cw = el.clientWidth || 600, fs = vb[2] * 12 / cw, r0 = vb[2] * 5 / cw;
  let grat = "";
  for (let lon = -180; lon <= 180; lon += 30){ const x = px(lon, 0)[0]; grat += `M${x} 0V${H}`; }
  for (let lat = -60; lat <= 80; lat += 30){ const y = px(0, lat)[1]; grat += `M0 ${y}H${W}`; }
  const placed = [];
  const tw = s => [...s].reduce((a, ch) => a + (/[\x00-\x7f]/.test(ch) ? .58 : 1), 0) * fs + fs * .9;
  const overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  const nodes = hs.map((h, i) => {
    const [x, y] = px(h.lon, h.lat), r = r0 * (.75 + h.level * .25);
    const label = `${h.place}${CAT[h.cat]?.s || ""} · ${h.status}`;
    const w = tw(label), lh = fs * 1.5;
    let box = null;
    const cands = [[r * 1.6, -lh / 2], [-r * 1.6 - w, -lh / 2], [r * 1.2, -lh * 1.3], [r * 1.2, lh * .3], [-r * 1.2 - w, -lh * 1.3], [-r * 1.2 - w, lh * .3], [r * 1.6, -lh * 2.2], [r * 1.6, lh * 1.2]];
    for (const [dx, dy] of cands){
      const b = {x: x + dx, y: y + dy, w, h: lh};
      if (b.x < vb[0] + 2 || b.x + b.w > vb[0] + vb[2] - 2 || b.y < vb[1] + 2 || b.y + b.h > vb[1] + vb[3] - 2) continue;
      if (placed.some(p => overlap(p, b))) continue;
      box = b; break;
    }
    placed.push({x: x - r, y: y - r, w: 2 * r, h: 2 * r});
    if (box) placed.push(box);
    return {h, i, x, y, r, label, box, fs};
  });
  const land = await loadLand();
  el.innerHTML = `<svg viewBox="${vb.map(v => v.toFixed(1)).join(" ")}" role="img" aria-label="全球局勢地圖">
    <rect x="0" y="0" width="${W}" height="${H}" fill="var(--sea)"/>
    <path class="grat" d="${grat}" vector-effect="non-scaling-stroke"/>
    ${land ? `<path class="land" d="${land}" vector-effect="non-scaling-stroke"/>` : ""}
    ${nodes.map(n => `<g class="hs" data-i="${n.i}" tabindex="0" role="button" aria-label="${esc(n.label)}">
      ${n.h.level >= 2 ? `<circle class="pulse" cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${CAT[n.h.cat]?.c}"/>` : ""}
      <circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${CAT[n.h.cat]?.c}" stroke="var(--panel)" stroke-width="${n.r * .35}"/>
      ${n.box ? `<rect x="${n.box.x}" y="${n.box.y}" width="${n.box.w}" height="${n.box.h}" rx="${n.fs * .35}" fill="${CAT[n.h.cat]?.c}" opacity="${selectedHs == null || selectedHs === n.i ? 1 : .55}"/>
      <text x="${n.box.x + n.fs * .45}" y="${n.box.y + n.box.h * .7}" font-size="${n.fs}">${esc(n.label)}</text>` : ""}</g>`).join("")}
  </svg>${land ? "" : '<div class="mapnote">底圖載入失敗，只顯示座標點</div>'}`;

/* ---------- 我的資產 ---------- */
const getHoldings = () => store.get("holdings", []);
const setHoldings = h => store.set("holdings", h);
function guessCur(sym){ return /\.(TW|TWO)$/i.test(sym) ? "TWD" : "USD"; }
function portfolio(){
  const hs = getHoldings(); const q = D?.quotes || {};
  const fx = q["TWD=X"]?.last || null;
  let val = 0, cost = 0, day = 0, missing = 0;
  const rows = hs.map(h => {
    const qq = q[h.sym];
    const cur = qq?.currency || h.currency || guessCur(h.sym);
    const rate = cur === "TWD" ? 1 : cur === "USD" ? fx : null;
    const price = qq?.last ?? (h.manualPrice ? +h.manualPrice : null);
    const prev = qq?.prev ?? null;
    const r = {...h, cur, rate, price, chgPct: qq?.chgPct ?? null, tracked: !!qq};
    if (price != null && rate){
      r.val = price * h.shares * rate; r.costTot = h.cost * h.shares * rate;
      r.pl = r.val - r.costTot; r.plPct = r.costTot ? r.pl / r.costTot * 100 : null;
      r.day = prev != null ? (price - prev) * h.shares * rate : 0;
      val += r.val; cost += r.costTot; day += r.day;
    } else missing++;
    return r;
  });
  return {rows, val, cost, day, pl: val - cost, retPct: cost ? (val - cost) / cost * 100 : null, missing, fx};
}
const PALETTE = ["var(--accent)", "var(--ceasefire)", "var(--epidemic)", "var(--unrest)", "var(--military)", "var(--politics)", "var(--disaster)", "var(--war)"];
function viewAssets(){
  const pf = portfolio(); const tracked = Object.values(D.quotes || {});
  const opts = tracked.map(t => `<option value="${esc(t.sym)}">${esc(t.name)}</option>`).join("");
  const sum = pf.rows.length ? `
    <section class="sumrow">
      <div class="card sum"><div class="k">總市值（台幣）</div><div class="v num">${nf(pf.val, 0)}</div><div class="s muted">成本 ${nf(pf.cost, 0)}</div></div>
      <div class="card sum"><div class="k">未實現損益</div><div class="v num ${cls(pf.pl)}">${pf.pl >= 0 ? "+" : ""}${nf(pf.pl, 0)}</div><div class="s num ${cls(pf.retPct)}">報酬率 ${sgn(pf.retPct, 2)}</div></div>
      <div class="card sum"><div class="k">今日損益</div><div class="v num ${cls(pf.day)}">${pf.day >= 0 ? "+" : ""}${nf(pf.day, 0)}</div><div class="s muted">${pf.cost ? "占成本 " + sgn(pf.day / pf.cost * 100, 2) : ""}</div></div>
      <div class="card sum"><div class="k">持股檔數</div><div class="v num">${pf.rows.length}</div><div class="s muted">美元/台幣 ${pf.fx ? nf(pf.fx, 3) : "—"}${pf.missing ? ` · ${pf.missing} 檔沒有現價` : ""}</div></div>
    </section>
    <section class="card"><div class="card-h"><h2>配置比例</h2></div>
      <div class="alloc">${pf.rows.filter(r => r.val).map((r, i) => `<span style="width:${r.val / pf.val * 100}%;background:${PALETTE[i % PALETTE.length]}" title="${esc(r.name)}"></span>`).join("")}</div>
      <div class="legend">${pf.rows.filter(r => r.val).map((r, i) => `<span><i style="background:${PALETTE[i % PALETTE.length]}"></i>${esc(r.name || r.sym)} ${nf(r.val / pf.val * 100, 1)}%</span>`).join("")}</div>
    </section>` : "";
  const table = pf.rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>名稱</th><th>股數</th><th>成本價</th><th>現價</th><th>今日</th><th>市值（台幣）</th><th>損益</th><th>報酬率</th><th></th></tr></thead><tbody>
    ${pf.rows.map(r => `<tr>
      <td>${esc(r.name || r.sym)}<span class="sub">${esc(r.sym)} · ${esc(r.cur)}${r.tracked ? "" : r.price != null ? " · 手動現價" : " · 未追蹤"}</span></td>
      <td class="num">${nf(r.shares, r.shares % 1 ? 2 : 0)}</td><td class="num">${nf(r.cost)}</td>
      <td class="num">${r.price != null ? nf(r.price) : "—"}</td><td class="num ${cls(r.chgPct)}">${r.chgPct != null ? tri(r.chgPct) : "—"}</td>
      <td class="num">${r.val != null ? nf(r.val, 0) : "—"}</td><td class="num ${cls(r.pl)}">${r.pl != null ? (r.pl >= 0 ? "+" : "") + nf(r.pl, 0) : "—"}</td>
      <td class="num ${cls(r.plPct)}">${r.plPct != null ? sgn(r.plPct, 2) : "—"}</td>
      <td><button class="rowbtn" data-edit="${esc(r.id)}" type="button">編輯</button><button class="rowbtn" data-del="${esc(r.id)}" type="button">刪除</button></td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty"><p><b>還沒有持股</b></p><p>在下方輸入代號、股數和平均成本就能開始追蹤，或先載入範例看看效果。</p><button class="btn" id="loadSample" type="button">載入範例持股</button></div>`;
  return `<div style="display:flex;flex-direction:column;gap:12px">
    ${sum}
    <section class="card"><div class="card-h"><h2>持股明細</h2><span class="hint"><button class="linkish" id="btnExport" type="button">匯出</button> · <button class="linkish" id="btnImport" type="button">匯入</button></span></div>${table}</section>
    <section class="card"><div class="card-h"><h2 id="formTitle">新增持股</h2></div>
      <form class="form" id="hForm" autocomplete="off">
        <input type="hidden" id="f-id">
        <div class="field"><label for="f-sym">代號</label><input id="f-sym" list="symList" required placeholder="例：2330.TW、NVDA"><datalist id="symList">${opts}</datalist></div>
        <div class="field"><label for="f-name">名稱</label><input id="f-name" placeholder="自動帶入"></div>
        <div class="field"><label for="f-shares">股數</label><input id="f-shares" type="number" step="any" min="0" required></div>
        <div class="field"><label for="f-cost">平均成本（每股）</label><input id="f-cost" type="number" step="any" min="0" required></div>
        <div class="field"><label for="f-manual">手動現價（選填）</label><input id="f-manual" type="number" step="any" min="0" placeholder="沒追蹤的代號才需要"></div>
        <div class="field" style="display:flex;gap:6px"><button class="btn primary" type="submit" id="f-submit">新增</button><button class="btn" type="button" id="f-cancel" hidden>取消</button></div>
      </form>
      <p class="note">持股只存在這台裝置的瀏覽器裡，不會上傳。台股代號加 .TW（上櫃加 .TWO），美股直接打代號。要讓程式自動抓到現價，代號必須在 config.json 的 watchlist（或已追蹤的指數、AI 股）裡；新加的代號要等下一次抓取後才有價格。目前只換算台幣與美元計價的標的。</p>
    </section></div>`;
}
function afterAssets(){
  const form = $("#hForm");
  const fill = h => { $("#f-id").value = h?.id || ""; $("#f-sym").value = h?.sym || ""; $("#f-name").value = h?.name || ""; $("#f-shares").value = h?.shares ?? ""; $("#f-cost").value = h?.cost ?? ""; $("#f-manual").value = h?.manualPrice ?? "";
    $("#formTitle").textContent = h ? "編輯持股" : "新增持股"; $("#f-submit").textContent = h ? "儲存" : "新增"; $("#f-cancel").hidden = !h; };
  $("#f-sym").addEventListener("change", () => { const q = D.quotes[$("#f-sym").value.trim().toUpperCase()] || D.quotes[$("#f-sym").value.trim()]; if (q && !$("#f-name").value) $("#f-name").value = q.name; });
  form.addEventListener("submit", e => {
    e.preventDefault();
    let sym = $("#f-sym").value.trim(); if (!/\.(TW|TWO)$/i.test(sym) && !/^\^|=|-/.test(sym)) sym = sym.toUpperCase(); else sym = sym.replace(/\.(tw|two)$/i, m => m.toUpperCase());
    const h = {id: $("#f-id").value || "h" + Date.now(), sym, name: $("#f-name").value.trim() || D.quotes[sym]?.name || sym,
      shares: +$("#f-shares").value, cost: +$("#f-cost").value, manualPrice: $("#f-manual").value ? +$("#f-manual").value : null};
    const all = getHoldings(); const i = all.findIndex(x => x.id === h.id);
    if (i >= 0) all[i] = h; else all.push(h);
    setHoldings(all); render();
  });
  $("#f-cancel").addEventListener("click", () => fill(null));
  document.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => { fill(getHoldings().find(x => x.id === b.dataset.edit)); form.scrollIntoView({behavior: "smooth", block: "center"}); }));
  document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.armed){ setHoldings(getHoldings().filter(x => x.id !== b.dataset.del)); render(); }
    else { b.dataset.armed = "1"; b.textContent = "確定刪除？"; b.style.color = "var(--red)"; setTimeout(() => { if (b.isConnected){ delete b.dataset.armed; b.textContent = "刪除"; b.style.color = ""; } }, 3000); }
  }));
  $("#loadSample")?.addEventListener("click", () => {
    setHoldings([
      {id: "s1", sym: "0050.TW", name: "元大台灣50（範例）", shares: 2000, cost: 150, manualPrice: null},
      {id: "s2", sym: "2330.TW", name: "台積電（範例）", shares: 300, cost: 820, manualPrice: null},
      {id: "s3", sym: "NVDA", name: "NVIDIA（範例）", shares: 40, cost: 110, manualPrice: null},
      {id: "s4", sym: "VOO", name: "S&P 500 ETF（範例）", shares: 15, cost: 480, manualPrice: null}]);
    render();
  });
  $("#btnExport").addEventListener("click", () => {
    const txt = JSON.stringify(getHoldings(), null, 1);
    modal(`<h2>匯出持股</h2><p class="note">複製下面的文字存起來，換裝置時用「匯入」貼上即可。</p><textarea id="expTxt" rows="10" readonly>${esc(txt)}</textarea>
      <div class="foot"><span class="note" id="copyMsg"></span><button class="btn primary" id="copyBtn" type="button">複製</button><button class="btn" data-close type="button">關閉</button></div>`);
    $("#copyBtn").addEventListener("click", async () => { try { await navigator.clipboard.writeText(txt); $("#copyMsg").textContent = "已複製"; } catch { $("#expTxt").select(); $("#copyMsg").textContent = "已選取，請按 Ctrl/⌘+C 複製"; } });
  });
  $("#btnImport").addEventListener("click", () => {
    modal(`<h2>匯入持股</h2><p class="note">貼上之前匯出的文字。會取代目前的持股清單。</p><textarea id="impTxt" rows="10"></textarea><p class="note" id="impMsg"></p>
      <div class="foot"><button class="btn primary" id="impBtn" type="button">匯入</button><button class="btn" data-close type="button">取消</button></div>`);
    $("#impBtn").addEventListener("click", () => {
      try { const arr = JSON.parse($("#impTxt").value); if (!Array.isArray(arr) || !arr.every(x => x.sym && x.shares != null && x.cost != null)) throw 0;
        setHoldings(arr.map((x, i) => ({id: x.id || "h" + Date.now() + i, ...x}))); closeModal(); render(); }
      catch { $("#impMsg").textContent = "格式不對：需要之前匯出的 JSON 文字（每筆要有 sym、shares、cost）。"; }
    });
  });
}

/* ---------- 視窗 ---------- */

  $("#mdl").addEventListener("click", e => { if (e.target.id === "mdl" || e.target.hasAttribute("data-close")) closeModal(); });
  $("#mdl [data-close]")?.focus();
}
const closeModal = () => $("#modalRoot").innerHTML = "";
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

function showSources(){
  const m = D?.meta || {};
  modal(`<h2>資料來源</h2>
    ${(m.sources || []).map(s => `<div class="row"><div><b>${esc(s.name)}</b><div class="note">${esc(s.use)}</div></div><a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">前往</a></div>`).join("")}
    <p class="note">行情為 Yahoo Finance 的延遲或收盤資料；新聞分類和地區是用關鍵字規則判斷，可能分錯，請點進原文確認。本頁不構成投資建議。</p>
    ${(m.warnings || []).length ? `<h2 style="font-size:15px;margin-top:14px">這次抓取的問題（${m.warnings.length}）</h2><div class="warnlist">${m.warnings.map(w => `<div>${esc(w)}</div>`).join("")}</div>` : '<p class="note">這次抓取沒有錯誤。</p>'}`);
}
function showSettings(){
  const s = settings();
  const seg = (key, opts) => `<div class="seg">${opts.map(([v, l]) => `<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${String(s[key]) === String(v)}">${l}</button>`).join("")}</div>`;
  modal(`<h2>設定</h2>
    <div class="row"><span>外觀</span>${seg("theme", [["system", "跟隨系統"], ["light", "淺色"], ["dark", "深色"]])}</div>
    <div class="row"><span>漲跌顏色</span>${seg("colors", [["tw", "紅漲綠跌"], ["us", "綠漲紅跌"]])}</div>

    <div class="row"><span>清除所有持股</span><button class="btn" id="wipe" type="button">清除</button></div>
    <p class="note">設定只存在這台裝置。資料本身的更新頻率由 GitHub Actions 排程決定（預設每 3 小時）。</p>`);
  document.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => {
    const ns = {...settings(), [b.dataset.k]: b.dataset.k === "auto" ? +b.dataset.v : b.dataset.v};
    store.set("settings", ns); applySettings(); showSettings(); if (b.dataset.k === "colors") render();
  }));
  $("#wipe").addEventListener("click", e => { const b = e.currentTarget; if (b.dataset.armed){ setHoldings([]); closeModal(); render(); } else { b.dataset.armed = 1; b.textContent = "再按一次確認"; b.style.color = "var(--red)"; } });
}
const settings = () => ({theme: "system", colors: "tw", auto: 0, ...store.get("settings", {})});
function applySettings(){
  const s = settings(), r = document.documentElement;
  if (s.theme === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", s.theme);
  r.classList.toggle("us-colors", s.colors === "us");
  clearInterval(reloadTimer); if (s.auto) reloadTimer = setInterval(refresh, s.auto * 60000);
}

/* ---------- 切換 ---------- */
function render(){
  if (!D) return;
  renderHeader();
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === TAB));
  const v = $("#view");
  if (TAB === "brief") v.innerHTML = viewBrief();
  else if (TAB === "assets"){ v.innerHTML = viewAssets(); afterAssets(); }
  else { v.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">${viewWorld()}</div>`; afterWorld(); }
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  TAB = t.dataset.tab; store.set("tab", TAB);
  try { history.replaceState(null, "", "#" + TAB); } catch {}
  render();
}));
$("#btnReload").addEventListener("click", refresh);
$("#btnSources").addEventListener("click", showSources);
$("#btnSettings").addEventListener("click", showSettings);

const h0 = (location.hash || "").slice(1);
TAB = ["brief", "world", "assets"].includes(h0) ? h0 : store.get("tab", "world");
applySettings();
refresh();
</script>
